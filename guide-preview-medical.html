<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Malpractice Insurance Marketing Guide Preview</title>
    <style>
        .guide-preview {
            width: 400px;
            height: 250px;
            background: linear-gradient(135deg, #be185d 0%, #ec4899 50%, #f472b6 100%);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
        }

        .guide-preview::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="3" fill="white" opacity="0.15"/></svg>') repeat;
            animation: wave 18s infinite ease-in-out;
        }

        .guide-icon {
            font-size: 48px;
            margin-bottom: 15px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        .guide-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .guide-subtitle {
            font-size: 14px;
            opacity: 0.9;
            font-weight: 500;
        }

        @keyframes wave {
            0%, 100% { transform: translateY(0px) scale(1); }
            25% { transform: translateY(-10px) scale(1.05); }
            75% { transform: translateY(10px) scale(0.95); }
        }
    </style>
</head>
<body>
    <div class="guide-preview">
        <div class="guide-icon">🏥</div>
        <div class="guide-title">Medical Malpractice Insurance Marketing</div>
        <div class="guide-subtitle">Complete Healthcare Provider Guide</div>
    </div>
</body>
</html>
